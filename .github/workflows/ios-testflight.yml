# ツギメモの iOS 版(アプリ本体+ウィジェット拡張 TsugiWidget)を GitHub のクラウド Mac で組み立て、TestFlight へ送る。
# 持ち主は Mac を持っていないので、これが iOS を組み立てる唯一の道。Actions の画面から手で実行する。
# お手本(ニガテ帳の ios-testflight.yml)を写して直した物。違い:
#  - ウィジェット拡張と App Group(group.jp.tsugimemo.app)があるので、署名はアーカイブの時点で行う(既定)。
#    署名なしでアーカイブ→書き出しで署名、のお手本の道は App Group の権限が付かない恐れがあるため予備に回した。
#  - 先に compile_only で「コンパイルが通るか」だけを確かめる(Apple のシークレット不要)。
# 必要なシークレット4つと Apple 側の準備は RELEASE.md の「iOS」を参照。
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      compile_only:
        description: "署名もアップロードもせずにコンパイルだけ試す(Apple のシークレット不要)"
        type: boolean
        default: true
      sign_at:
        description: "署名する時点。archive(既定・App Group 向き)/ export(お手本と同じ道)"
        type: choice
        options: [archive, export]
        default: archive

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROJECT: ios/App/App.xcodeproj
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test, build web assets and sync the iOS project
        run: |
          npm test
          npm run build
          npx cap sync ios
          # ウィジェット拡張のターゲット(もう入っていれば何もしない)
          python3 scripts/ios_add_widget.py

      - name: Compile without signing
        if: inputs.compile_only
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Check secrets
        if: ${{ !inputs.compile_only }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error::Secret ASC_KEY_P8_BASE64 is not set"; exit 1; fi

      - name: Install App Store Connect API key
        if: ${{ !inputs.compile_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # 既定: アーカイブの時点で自動署名する(App Group の権限を本体と拡張の両方に入れるため)
      - name: Archive (signed)
        if: ${{ !inputs.compile_only && inputs.sign_at == 'archive' }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      # 予備: お手本(DIAMOND NINE・ニガテ帳)で動いた、署名なしアーカイブ→書き出しで署名
      - name: Archive (unsigned)
        if: ${{ !inputs.compile_only && inputs.sign_at == 'export' }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Check the widget extension is inside the archive
        if: ${{ !inputs.compile_only }}
        run: |
          ls "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/PlugIns/TsugiWidget.appex" || { echo "::error::TsugiWidget.appex がアーカイブに入っていません"; exit 1; }
          codesign -d --entitlements :- "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | grep -q "group.jp.tsugimemo.app" \
            && echo "App Group の権限あり" || echo "::warning::本体の署名に App Group が見当たりません(sign_at=export の時は書き出しで付く想定)"

      - name: Export and upload to TestFlight
        if: ${{ !inputs.compile_only }}
        run: |
          plutil -replace teamID -string "$APPLE_TEAM_ID" ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
