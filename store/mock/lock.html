<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430">
<title>ロック画面の見本</title>
<style>
  /* ストアの画面写真用。ロック画面に置いた時の見え方(ウィジェットの中身は TsugiWidget.swift と同じ文の型) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 430px; height: 932px; overflow: hidden; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; color: #f6f2ea; }
  .wall {
    position: absolute; inset: 0;
    background:
      radial-gradient(90% 55% at 70% 18%, rgba(214, 140, 92, 0.30), transparent 70%),
      radial-gradient(80% 60% at 10% 90%, rgba(120, 96, 70, 0.35), transparent 70%),
      linear-gradient(180deg, #3a332c 0%, #2a2622 55%, #1d1b18 100%);
  }
  .home .wall {
    background:
      radial-gradient(80% 50% at 20% 10%, rgba(230, 196, 160, 0.45), transparent 70%),
      linear-gradient(180deg, #cdbfa8 0%, #b9a98f 100%);
  }
  .top { position: absolute; top: 70px; left: 0; right: 0; text-align: center; }
  .date { font-size: 19px; font-weight: 600; opacity: 0.92; letter-spacing: 0.02em; }
  .time { font-size: 104px; font-weight: 700; line-height: 1; margin-top: 2px; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .inline { font-size: 15px; font-weight: 600; opacity: 0.9; margin-bottom: 2px; }
  .row { display: flex; gap: 12px; justify-content: center; margin: 14px 26px 0; }
  .rect { flex: 1; background: rgba(255,255,255,0.16); border-radius: 18px; padding: 10px 14px; text-align: left; }
  .rect .t { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .ring { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
  .rect .n { font-size: 13px; opacity: 0.75; padding-left: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .circ { width: 76px; flex: none; background: rgba(255,255,255,0.16); border-radius: 50%; height: 76px; align-self: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .circ b { font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .circ small { font-size: 10px; opacity: 0.8; }
  .live {
    position: absolute; left: 14px; right: 14px; bottom: 118px;
    background: #f4efe4; color: #22201c; border-radius: 26px; padding: 16px 20px 18px;
  }
  .live .h { display: flex; justify-content: space-between; font-size: 13px; color: rgba(34,32,28,0.62); font-weight: 600; }
  .live .m { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .live .m .ring { width: 28px; height: 28px; border: 3px solid #c8402a; }
  .live .m span { font-size: 23px; font-weight: 800; }
  .live hr { border: 0; border-top: 1px solid rgba(34,32,28,0.16); margin: 12px 0 8px; }
  .live p { font-size: 16px; color: rgba(34,32,28,0.8); line-height: 1.7; }
  .home .widgets { position: absolute; top: 96px; left: 26px; right: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .w { border-radius: 24px; padding: 16px; color: #22201c; box-shadow: 0 6px 18px rgba(60,40,20,0.12); }
  .w.med { grid-column: 1 / 3; height: 172px; }
  .w.sm { height: 172px; }
  .w .h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; opacity: 0.62; }
  .w .m { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-weight: 800; }
  .w .m .ring { width: 19px; height: 19px; border-width: 2.5px; margin-top: 2px; }
  .w.med .m { font-size: 21px; }
  .w.sm .m { font-size: 16px; line-height: 1.35; }
  .w hr { border: 0; border-top: 1px solid currentColor; opacity: 0.18; margin: 10px 0 8px; }
  .w p { font-size: 13px; opacity: 0.78; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock { position: absolute; left: 0; right: 0; bottom: 130px; text-align: center; font-size: 13px; color: rgba(34,32,28,0.55); }
</style>
</head>
<body>
<div id="lock">
  <div class="wall"></div>
  <div class="top">
    <div class="date">10月9日(木)　いま 牛乳を買って帰る</div>
    <div class="time">9:41</div>
    <div class="row">
      <div class="rect">
        <div class="t"><span class="ring"></span>牛乳を買って帰る</div>
        <div class="n">つぎ　歯医者に電話する</div>
        <div class="n">つぎ　図書館の本を返す</div>
      </div>
      <div class="circ"><b>4</b><small>のこり</small></div>
    </div>
  </div>
  <div class="live">
    <div class="h"><span>いま</span><span>のこり 4</span></div>
    <div class="m"><span class="ring"></span><span>牛乳を買って帰る</span></div>
    <hr>
    <p>歯医者に電話する<br>図書館の本を返す</p>
  </div>
</div>
<script>
  if (location.hash === '#home') {
    document.body.classList.add('home');
    document.getElementById('lock').innerHTML = `
      <div class="wall"></div>
      <div class="widgets">
        <div class="w med" style="background:#f4efe4">
          <div class="h"><span>買い物</span><span>のこり 5</span></div>
          <div class="m"><span class="ring" style="border-color:#c8402a"></span>卵とバターを買う</div>
          <hr>
          <p>食器用の洗剤</p><p>トイレットペーパー</p><p>キッチンペーパー</p>
        </div>
        <div class="w sm" style="background:#22324a;color:#e9eef5">
          <div class="h"><span>仕事</span><span>3</span></div>
          <div class="m"><span class="ring" style="border-color:#f0a35b"></span>見積もりを送る</div>
          <hr>
          <p>会議室を取る</p><p>経費の精算</p>
        </div>
        <div class="w sm" style="background:#dce6d6;color:#1f2c22">
          <div class="h"><span>朝の支度</span><span>2</span></div>
          <div class="m"><span class="ring" style="border-color:#2f6b45"></span>植木に水をやる</div>
          <hr>
          <p>ゴミを出す</p>
        </div>
      </div>`;
  }
</script>
</body>
</html>
